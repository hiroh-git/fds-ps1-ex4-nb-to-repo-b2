[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titanic"
version = "0.1.0"
description = "The Titanic Kaggle package for Ex4"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yasuhiro Hara" },
]
dependencies = [] # See pixi.toml

[tool.hatch.build.targets.wheel]
packages = ["titanic"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".pixi",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "BLE", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
